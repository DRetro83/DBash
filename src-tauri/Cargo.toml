[package]
name = "dbash"
version = "0.4.1"
description = "DBash: a smart Debian terminal with a local AI that helps you learn Linux"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
tokio = { version = "1", features = ["process", "time", "rt", "macros"] }
portable-pty = "0.8"
tauri-plugin-clipboard-manager = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
